server.port=8080

# Database Configuration (Configurable via Environment Variables or defaults for local MySQL)
# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Minimum 256 bits secret key)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=600000

# Admin Registration Code (set via ADMIN_CODE environment variable - default ADMIN123 if not set)
admin.code=${ADMIN_CODE:ADMIN123}
